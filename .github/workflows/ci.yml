name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress workflows for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  # Gradle configuration
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"
  # Android SDK configuration  
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "26.1.10909125"

jobs:
  build:
    name: Build APKs and AABs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    strategy:
      matrix:
        flavor: [offline, hybrid, cloudstt]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_COMPILE_SDK }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
          ndk: ${{ env.ANDROID_NDK_VERSION }}
      
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      
      - name: Install additional SDK components
        run: |
          sdkmanager "platforms;android-${{ env.ANDROID_COMPILE_SDK }}"
          sdkmanager "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"
          sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"
          sdkmanager "cmake;3.22.1"
          sdkmanager "platform-tools"
      
      - name: Set up Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_PATH
      
      - name: Print Android environment
        run: |
          chmod +x scripts/ci/print-android-env.sh
          ./scripts/ci/print-android-env.sh
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true
          cache-overwrite-existing: false
      
      - name: Build ${{ matrix.flavor }} APKs and AABs
        run: |
          ./gradlew --stacktrace --no-configuration-cache \
            :app:assemble${{ matrix.flavor }}Debug \
            :wear:assemble${{ matrix.flavor }}Debug
      
      - name: Upload app APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.flavor }}-debug-apk
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          retention-days: 14
      
      - name: Upload wear APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wear-${{ matrix.flavor }}-debug-apk
          path: wear/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          retention-days: 14
      
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ matrix.flavor }}
          path: |
            **/build/reports/
            **/build/outputs/logs/
          retention-days: 7

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      matrix:
        flavor: [offline, hybrid, cloudstt]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_COMPILE_SDK }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
      
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      
      - name: Run unit tests for ${{ matrix.flavor }}
        run: |
          ./gradlew --stacktrace \
            :app:test${{ matrix.flavor }}DebugUnitTest \
            :wear:test${{ matrix.flavor }}DebugUnitTest \
            test
      
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.flavor }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14

  lint:
    name: Lint and Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_COMPILE_SDK }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
      
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      
      - name: Run lint checks
        run: |
          ./gradlew --stacktrace \
            :app:lintOfflineDebug \
            :wear:lintOfflineDebug
      
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
          retention-days: 14

  repo-map:
    name: Repository Map Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Run repo-map tool
        run: |
          cd tools/repo-map
          python3 run.py
      
      - name: Check for repository drift
        run: |
          # Check if repo-map.json or REPO_MAP.md have changed
          if ! git diff --quiet repo-map.json REPO_MAP.md; then
            echo "❌ Repository map is out of date!"
            echo "The following files have changes:"
            git diff --name-only repo-map.json REPO_MAP.md
            echo ""
            echo "Please run 'python3 tools/repo-map/run.py' and commit the changes."
            exit 1
          else
            echo "✅ Repository map is up to date"
          fi
      
      - name: Upload repo-map artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-map-output
          path: |
            repo-map.json
            REPO_MAP.md
          retention-days: 7

  # Optional instrumentation tests (requires emulator)
  instrumentation-tests:
    name: Instrumentation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        api-level: [26, 30]
        flavor: [offline]  # Only test offline flavor to save CI time
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ matrix.api-level }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
      
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true
      
      - name: AVD cache
        uses: actions/cache@v3
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}
      
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew --stacktrace \
              :app:connected${{ matrix.flavor }}DebugAndroidTest \
              :wear:connected${{ matrix.flavor }}DebugAndroidTest
      
      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports-api${{ matrix.api-level }}-${{ matrix.flavor }}
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 14

  # Diagnostics job for debugging CI failures
  diagnostics:
    name: CI Diagnostics
    runs-on: ubuntu-latest
    if: failure()
    needs: [build, test, lint]
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_COMPILE_SDK }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
          ndk: ${{ env.ANDROID_NDK_VERSION }}
      
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Print comprehensive diagnostics
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          echo "=== Gradle Environment ==="
          ./gradlew --version
          
          echo "=== Android SDK Environment ==="
          chmod +x scripts/ci/print-android-env.sh
          ./scripts/ci/print-android-env.sh
          
          echo "=== Gradle Projects ==="
          ./gradlew projects || true
          
          echo "=== Available Gradle Tasks ==="
          ./gradlew tasks --all | head -100 || true
          
          echo "=== SDK Manager List ==="
          sdkmanager --list | head -50 || true
          
          echo "=== NDK Information ==="
          if [ -d "$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" ]; then
            echo "NDK installed at: $ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}"
            ls -la "$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}"
          else
            echo "NDK not found at expected location"
          fi
          
          echo "=== CMake Information ==="
          cmake --version || echo "CMake not found"
          
          echo "=== Last 200 lines of Gradle daemon logs ==="
          find ~/.gradle/daemon -name "*.log" -exec tail -200 {} \; 2>/dev/null || echo "No daemon logs found"