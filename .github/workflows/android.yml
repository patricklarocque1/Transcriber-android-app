name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-repo:
    name: Validate Repository Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run repo-map analysis
        run: |
          cd tools/repo-map
          python run.py

      - name: Check for dependency cycles
        run: |
          python3 -c "
          import json, sys
          with open('repo-map.json', 'r') as f:
              data = json.load(f)
          cycles = data.get('graphs', {}).get('cycles', [])
          if cycles:
              print(f'ERROR: Found {len(cycles)} dependency cycles')
              for cycle in cycles:
                  print(f'  - {cycle}')
              sys.exit(1)
          else:
              print('✓ No dependency cycles found')
          "

      - name: Validate repo-map schema
        run: |
          cd tools/repo-map
          python -m pytest tests/test_schema.py -v

      - name: Upload repo analysis
        uses: actions/upload-artifact@v4
        with:
          name: repo-analysis
          path: |
            repo-map.json
            REPO_MAP.md
            *.mmd

  build:
    name: Build (Debug)
    runs-on: ubuntu-latest
    needs: validate-repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Point local.properties at CI SDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Install NDK for native builds
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: Run unit tests
        run: |
          ./gradlew --stacktrace --no-daemon :app:testDebugUnitTest :wear:testDebugUnitTest

      - name: Generate coverage reports
        run: |
          ./gradlew --stacktrace --no-daemon :app:jacocoTestReport :wear:jacocoTestReport

      - name: Enforce app coverage >= 90%
        run: |
          ./gradlew --stacktrace --no-daemon :app:jacocoTestCoverageVerification

      - name: Run instrumentation tests (if emulator available)
        continue-on-error: true
        run: |
          # Skip instrumentation tests in CI for now due to emulator complexity
          echo "Instrumentation tests skipped in CI"

      - name: Gradle build (debug, all flavors)
        run: |
          ./gradlew --stacktrace --no-daemon :app:assembleDebug :wear:assembleDebug

      - name: Archive test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            app/build/reports/jacoco/jacocoTestReport/html/
            app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            wear/build/reports/jacoco/jacocoTestReport/html/
            wear/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

      - name: Upload APKs (debug)
        uses: actions/upload-artifact@v4
        with:
          name: apks-debug
          path: |
            app/build/outputs/apk/**/debug/*.apk
            wear/build/outputs/apk/**/debug/*.apk

  release:
    name: Build (Release, signed)
    runs-on: ubuntu-latest
    needs: build
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Point local.properties at CI SDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Decode keystore and write properties
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_ALIAS_PASSWORD != '' }}
        run: |
          mkdir -p keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_ALIAS_PASSWORD}
          EOF

      - name: Gradle build (release, all flavors)
        run: |
          ./gradlew --stacktrace --no-daemon :app:assembleRelease :wear:assembleRelease

      - name: Upload APKs (release)
        uses: actions/upload-artifact@v4
        with:
          name: apks-release
          path: |
            app/build/outputs/apk/**/release/*.apk
            wear/build/outputs/apk/**/release/*.apk
